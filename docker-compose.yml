services:
  kafka:
    image: apache/kafka:4.4.0
    container_name: happiness-kafka
    ports:
      - "9092:9092"

  postgres:
    image: postgres:16
    container_name: happiness-postgres
    environment:
      POSTGRES_USER: happiness
      POSTGRES_PASSWORD: happiness
      POSTGRES_DB: happiness_dw
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: